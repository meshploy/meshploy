name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Go vet (all modules) ──────────────────────────────────────────────────────
  vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/proxy/go.sum
            packages/db/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/mcpserver/go.sum

      # Every module in go.work. The API core lives in packages/server since it
      # moved out of apps/api/internal, so vetting only apps/* would skip most
      # of the codebase.
      - name: vet all workspace modules
        run: |
          for m in apps/api apps/cli apps/proxy                    packages/db packages/client packages/mcpserver                    packages/license packages/server; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...) || exit 1
            echo "::endgroup::"
          done

  # ── CLI build ─────────────────────────────────────────────────────────────────
  build-cli:
    name: CLI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: build
        run: cd apps/cli && go build ./...

  # ── CLI tests ────────────────────────────────────────────────────────────────
  test-cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: test
        run: cd apps/cli && go test ./... -v -timeout 60s

  # ── DB migration test ─────────────────────────────────────────────────────────
  test-db:
    name: DB migration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/db/go.mod
          cache-dependency-path: packages/db/go.sum

      - name: test
        run: cd packages/db && go test ./... -v -timeout 120s

  # ── API service tests ─────────────────────────────────────────────────────────
  test-api:
    name: API service tests (packages/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: test
        run: cd packages/server && go test ./... -v -timeout 300s

  # ── Web typecheck ─────────────────────────────────────────────────────────────
  typecheck-web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install
        run: cd apps/web && npm ci

      - name: typecheck
        run: cd apps/web && npx tsc -b

  # ── Web E2E (demo mode) ───────────────────────────────────────────────────────
  e2e-web:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install
        run: cd apps/web && npm ci

      - name: install playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: e2e tests
        run: cd apps/web && npx playwright test
        env:
          CI: true
          VITE_DEMO_MODE: "true"
