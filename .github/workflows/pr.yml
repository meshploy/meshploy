name: PR Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Go vet (all modules) ──────────────────────────────────────────────────────
  vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: |
            apps/api/go.sum
            apps/cli/go.sum
            apps/proxy/go.sum
            packages/db/go.sum
            packages/server/go.sum
            packages/client/go.sum
            packages/mcpserver/go.sum

      # Every module in go.work. The API core lives in packages/server since it
      # moved out of apps/api/internal, so vetting only apps/* would skip most
      # of the codebase.
      - name: vet all workspace modules
        run: |
          for m in apps/api apps/cli apps/proxy                    packages/db packages/client packages/mcpserver                    packages/license packages/server packages/help; do
            echo "::group::go vet $m"
            (cd "$m" && go vet ./...) || exit 1
            echo "::endgroup::"
          done

  # ── CLI build ─────────────────────────────────────────────────────────────────
  # Only contributions from outside the repository. Commits pushed here follow
  # the project's own one-line convention, and the DCO is about recording the
  # right to submit someone else's work, which a fork's pull request is.
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '@'; then
              echo "missing Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo
            echo "Add it with: git commit -s --amend, then rebase the rest."
            echo "See CONTRIBUTING.md."
            exit 1
          fi
          echo "all commits signed off"

  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: "**/go.sum"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install console dependencies
        run: npm ci
        working-directory: apps/web

      # Regenerates from the built artifacts and fails when what is committed
      # no longer matches, the way the formatting check works. The same run
      # refuses a GPL, AGPL or SSPL dependency reaching a binary.
      - name: notices are current
        run: python3 scripts/gen-notices.py --check

  build-cli:
    name: CLI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: build
        run: cd apps/cli && go build ./...

  # ── CLI tests ────────────────────────────────────────────────────────────────
  test-cli:
    name: CLI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: test
        run: cd apps/cli && go test ./... -v -timeout 60s

  # ── Proxy tests ───────────────────────────────────────────────────────────────
  test-proxy:
    name: Proxy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/proxy/go.mod
          cache-dependency-path: apps/proxy/go.sum

      - name: test
        run: cd apps/proxy && go test ./... -v -timeout 60s

  # ── Help topics ───────────────────────────────────────────────────────────────
  # The console's help, the docs' Concepts and the MCP server read one text;
  # this keeps every topic parseable and every term pointing at a section.
  test-help:
    name: Help topics test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/help/go.mod

      - name: test
        run: cd packages/help && go test ./... -v

  # ── DB migration test ─────────────────────────────────────────────────────────
  test-db:
    name: DB migration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/db/go.mod
          cache-dependency-path: packages/db/go.sum

      - name: test
        run: cd packages/db && go test ./... -v -timeout 120s

  # ── API service tests ─────────────────────────────────────────────────────────
  test-api:
    name: API service tests (packages/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: test
        run: cd packages/server && go test ./... -v -timeout 300s

  # ── Web typecheck ─────────────────────────────────────────────────────────────
  typecheck-web:
    name: Web typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install
        run: cd apps/web && npm ci

      - name: typecheck
        run: cd apps/web && npx tsc -b

  # ── Web E2E (demo mode) ───────────────────────────────────────────────────────
  e2e-web:
    name: Web E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: install
        run: cd apps/web && npm ci

      - name: install playwright browsers
        run: cd apps/web && npx playwright install chromium --with-deps

      - name: e2e tests
        run: cd apps/web && npx playwright test
        env:
          CI: true
          VITE_DEMO_MODE: "true"
