name: Build & Push Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "apps/proxy/**"
      - "apps/builder/**"
      - "deploy/**"
      - "packages/db/**"
      # The API core moved here from apps/api/internal — without these, a
      # change to the server or its license verifier would rebuild nothing.
      - "packages/server/**"
      - "packages/license/**"
      - "packages/client/**"
      - "packages/mcpserver/**"
      - "go.work"
      - "go.work.sum"
      - "get.sh"
      - "apps/cli/**"
      - "VERSION"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: meshploy

jobs:
  # ── Detect changed paths ──────────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      api:     ${{ steps.filter.outputs.api }}
      web:     ${{ steps.filter.outputs.web }}
      proxy:   ${{ steps.filter.outputs.proxy }}
      builder: ${{ steps.filter.outputs.builder }}
      caddy:   ${{ steps.filter.outputs.caddy }}
      release: ${{ steps.release.outputs.release }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # A release lands as the push of release-please's merge commit. Its tag is
      # created with GITHUB_TOKEN, which starts no workflow, so this push is the
      # only build a release gets, and every image is built as the release in
      # it: the release PR touches no image's paths, so the change filters
      # alone would skip all but the API. A tag pushed by hand counts too.
      - name: Is this a release?
        id: release
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* || "$HEAD_MESSAGE" == *release-please* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - "apps/api/**"
              - "packages/db/**"
              - "packages/client/**"
              - "packages/mcpserver/**"
              - "packages/server/**"
              - "packages/license/**"
              - "go.work"
              - "go.work.sum"

            web:
              - "apps/web/**"

            proxy:
              - "apps/proxy/**"
              - "packages/db/**"
              # go work sync needs every workspace module manifest present.
              - "packages/server/**"
              - "packages/license/**"
              - "go.work"
              - "go.work.sum"

            builder:
              - "apps/builder/**"

            caddy:
              - "deploy/caddy/**"


  # ── API ───────────────────────────────────────────────────────────────────────
  # Built on every run, not only when its own code changed. Its version carries
  # the commit it was built from, and the console's edge update check compares
  # that with the newest successful run of this workflow. Skipped after a
  # web-only change, the API would keep its older commit and the console would
  # offer that change again after every upgrade.
  api:
    needs: changes
    name: API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every run builds the edge image: main and the commit's own tag, reporting
      # VERSION+SHA on the edge channel, because it sits somewhere AHEAD of the
      # version in the file. Without the distinction an edge image is
      # indistinguishable from the release it was cut after, so the update check
      # compares it against that release, finds parity, and tells the operator
      # they are current when they are running unreleased code.
      #
      # A release builds a second image, reporting the bare version on the stable
      # channel, for latest and the version tags. One image cannot be both: the
      # console upgrades on the channel the running build reports, so a stable
      # server running an edge-reporting image would be moved onto edge, and an
      # edge server running a stable-reporting one onto stable.
      - name: Docker meta (edge)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/api
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable={{is_default_branch}}

      - name: Docker meta (release)
        id: meta_release
        if: needs.changes.outputs.release == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/api
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=v${{ needs.changes.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changes.outputs.version }}

      - name: Read version
        id: ver
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          echo "release=${VERSION}" >> $GITHUB_OUTPUT
          echo "edge=${VERSION}+${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A variable, not a secret: public keys are public. They must match the
      # keys meshploy-ee builds with, or a licence activated here stops
      # verifying after the switch.
      - name: Build and push (edge)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.edge }}
            CHANNEL=edge
            LICENSE_PUBLIC_KEYS=${{ vars.LICENSE_PUBLIC_KEYS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (release)
        if: needs.changes.outputs.release == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.release }}
            CHANNEL=stable
            LICENSE_PUBLIC_KEYS=${{ vars.LICENSE_PUBLIC_KEYS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Web ───────────────────────────────────────────────────────────────────────
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    name: Web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/web
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Caddy (custom build with meshploy DNS provider) ──────────────────────────
  caddy:
    needs: changes
    if: needs.changes.outputs.caddy == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    name: Caddy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/caddy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: deploy/caddy
          file: deploy/caddy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Proxy ────────────────────────────────────────────────────────────────────
  proxy:
    needs: changes
    if: needs.changes.outputs.proxy == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    name: Proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/proxy
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Builder ───────────────────────────────────────────────────────────────────
  builder:
    needs: changes
    if: needs.changes.outputs.builder == 'true' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true'
    name: Builder
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.ORG }}/builder
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{version}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.changes.outputs.version }},enable=${{ needs.changes.outputs.release == 'true' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/builder
          file: apps/builder/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Enterprise ────────────────────────────────────────────────────────────────
  # meshploy-ee builds its images from this repository's source, and must follow
  # every release and every push to main: an Enterprise server upgrades to the
  # same release as a Community one, and refuses Enterprise images built from
  # another. This asks it to build this commit.
  #
  # EE_DISPATCH_TOKEN may do one thing: dispatch to meshploy-ee (a fine-grained
  # token with Contents: read and write on that repository only). Without it,
  # as in a fork, nothing is dispatched.
  enterprise:
    needs: [changes, api]
    if: github.repository == 'meshploy/meshploy' && github.ref == 'refs/heads/main'
    name: Dispatch the Enterprise build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Dispatch to meshploy-ee
        env:
          GH_TOKEN: ${{ secrets.EE_DISPATCH_TOKEN }}
          RELEASE: ${{ needs.changes.outputs.release }}
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::EE_DISPATCH_TOKEN is not set, so the Enterprise images were not rebuilt"
            exit 0
          fi
          gh api "repos/${ORG}/meshploy-ee/dispatches" \
            -f event_type=product-build \
            -f "client_payload[ref]=${GITHUB_SHA}" \
            -F "client_payload[release]=${RELEASE}" \
            -f "client_payload[version]=${VERSION}"
          echo "::notice::Dispatched the Enterprise build of ${GITHUB_SHA::7} (release: ${RELEASE})"
