name: Build & Release CLI

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/**"
      - "packages/hostagent/**"
      - "go.work"
      - "go.work.sum"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build CLI binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
          cache-dependency-path: apps/cli/go.sum

      - name: Build
        # The commit message goes through env, never into the script itself: a
        # merged pull request's title can end up in it, and inlined it would run.
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          cd apps/cli
          VERSION=$(cat ../../VERSION)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Stable release: VERSION only, channel=stable. Rolling: VERSION+SHA, channel=edge.
          if [[ "$HEAD_MESSAGE" == *release-please* ]]; then
            LDFLAGS="-s -w -X 'github.com/meshploy/apps/cli/cmd.Version=${VERSION}' -X 'github.com/meshploy/apps/cli/cmd.Channel=stable'"
          else
            LDFLAGS="-s -w -X 'github.com/meshploy/apps/cli/cmd.Version=${VERSION}+${SHORT_SHA}' -X 'github.com/meshploy/apps/cli/cmd.Channel=edge'"
          fi
          go build -ldflags="${LDFLAGS}" -o "meshploy-${{ matrix.goos }}-${{ matrix.goarch }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshploy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: apps/cli/meshploy-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # The licences of what the binary bundles travel with the binary.
      - name: Add licence and notices
        run: cp LICENSE NOTICE notices/THIRD-PARTY-NOTICES-cli.md dist/

      # Published beside the binaries so `meshploy update` and get.sh can check
      # a download against it. It comes from the same release, so it catches a
      # corrupted or truncated download, not a compromised release.
      - name: Write checksums
        run: |
          cd dist
          sha256sum meshploy-* > SHA256SUMS
          cat SHA256SUMS

      - name: Detect if this is a version bump
        id: detect
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(cat VERSION)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          # A version bump commit comes from release-please
          if [[ "$HEAD_MESSAGE" == *release-please* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # Uploaded with gh rather than an action, the way the tagged release
      # below is. The action deletes every asset before re-uploading, so one
      # stalled upload leaves the edge release missing a binary - which is
      # exactly what happened on 2026-09-17: arm64 landed, amd64 timed out, and
      # `get.sh` on amd64 got a 404 until the job was re-run. `--clobber`
      # replaces in place, so a failed attempt leaves the previous binary
      # standing, and a retry costs seconds.
      - name: Publish edge release (cli-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.github/upload-release-binaries.sh"
          NOTES=$(cat <<'EOF'
          Rolling build from `main`. Updated automatically on every change.
          Use `meshploy update --edge` to install this build.

          **Install stable instead:**
          ```bash
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/meshploy/meshploy/main/get.sh)"
          ```
          EOF
          )
          if gh release view cli-latest >/dev/null 2>&1; then
            gh release edit cli-latest --title "meshploy CLI (edge)" --notes "$NOTES" --prerelease
          else
            gh release create cli-latest --title "meshploy CLI (edge)" --notes "$NOTES" --prerelease
          fi

          upload_binaries cli-latest

      - name: Attach CLI binaries to existing release
        if: steps.detect.outputs.is_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source "${GITHUB_WORKSPACE}/.github/upload-release-binaries.sh"
          upload_binaries "v${{ steps.detect.outputs.version }}"
